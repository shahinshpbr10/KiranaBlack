name: kirana_black
description: "A new Flutter project."

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ">=3.6.1 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.3.6
  http: ^0.13.5
  flutter_hooks: ^0.18.6
  freezed_annotation: ^2.2.0
  json_serializable: ^6.7.1
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.3.3
  freezed: ^2.4.1
  json_serializable: ^6.7.1
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/fonts/

  fonts:
    - family: Hellix
      fonts:
        - asset: assets/fonts/Hellix-Regular.ttf
        - asset: assets/fonts/Hellix-Bold.ttf
        - asset: assets/fonts/Hellix-Light.ttf
